name: CI/CD

# on:
#   pull_request:
#     branches: [ master ]
  
# Exclude the workflow to run on changes to the helm chart
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go 1.22
      uses: actions/setup-go@v2
      with:
        go-version: 1.22
      id: go

    - name: Build
      run: go build -o go-web-app
    - name: Test
      run: go test -cover ./...

